name: SpectreShield CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev
    
    - name: Vet
      run: go vet ./...
    
    - name: Build Go
      run: GOOS=linux GOARCH=amd64 go build -o spectreshield ./cmd/spectreshield
    
    - name: Build eBPF
      run: |
        cd kernel
        clang -O2 -target bpf -c process_monitor.c -o ../process_monitor.o
        clang -O2 -target bpf -c network_monitor.c -o ../network_monitor.o
        clang -O2 -target bpf -c file_monitor.c -o ../file_monitor.o
    
    - name: Test
      run: go test -v ./...

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    
    - name: Build binaries
      run: |
        GOOS=linux GOARCH=amd64 go build -o spectreshield-linux-amd64 ./cmd/spectreshield
        GOOS=linux GOARCH=arm64 go build -o spectreshield-linux-arm64 ./cmd/spectreshield
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          spectreshield-linux-amd64
          spectreshield-linux-arm64
        draft: false
        prerelease: false
